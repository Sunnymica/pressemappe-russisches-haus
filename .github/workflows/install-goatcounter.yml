name: One-time GoatCounter install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-goatcounter.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add GoatCounter and update privacy policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tracking = '''<script data-goatcounter="https://pressemappe-russisches-haus.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>'''

          changed = []
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              if 'data-goatcounter="https://pressemappe-russisches-haus.goatcounter.com/count"' in text:
                  continue
              if '</head>' not in text:
                  continue
              text = text.replace('</head>', tracking + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(str(p))

          de = Path('datenschutz.html')
          text = de.read_text(encoding='utf-8')
          text = text.replace('Informationen gemäß Art. 13 DSGVO · Stand: Juli 2026', 'Informationen gemäß Art. 13 DSGVO · Stand: September 2026')
          text = text.replace(
              'Diese Website ist ein statisches Informationsangebot. Es gibt keine Benutzerkonten, keine Kommentarfunktion, keine Formulare, keine Newsletter-Anmeldung. Es werden keine Cookies gesetzt und keine Analyse- oder Tracking-Dienste eingesetzt. Ein Nutzerprofil wird nicht erstellt.',
              'Diese Website ist ein statisches Informationsangebot. Es gibt keine Benutzerkonten, keine Kommentarfunktion, keine Formulare und keine Newsletter-Anmeldung. Es werden keine Cookies gesetzt. Zur datensparsamen Reichweitenmessung wird GoatCounter eingesetzt; Nutzerprofile werden nicht erstellt.'
          )
          marker = '''  <div class="block">\n    <h2>Hosting und Server-Logfiles</h2>'''
          section = '''  <div class="block">\n    <h2>Reichweitenmessung mit GoatCounter</h2>\n    <p>Zur statistischen Auswertung der Seitennutzung wird GoatCounter eingesetzt, ein datensparsamer Webanalyse-Dienst von Martin Tournoij, Irland. Das Zählskript wird von <code>gc.zgo.at</code> geladen.</p>\n    <p>Nach Angaben des Anbieters setzt GoatCounter keine Cookies und speichert keine IP-Adressen, vollständigen User-Agent-Strings oder dauerhaften Tracking-IDs. Zur Erkennung wiederholter Aufrufe werden IP-Adresse und User-Agent vorübergehend im Arbeitsspeicher verarbeitet (bis zu acht Stunden), jedoch nicht in der Datenbank gespeichert. Gespeichert werden aggregierte Statistiken, insbesondere zu aufgerufenen Seiten, Referrern, Browsern und Betriebssystemen, Sprache, Bildschirmbreite und grobem Standort.</p>\n    <p>Die Daten des gehosteten GoatCounter-Dienstes werden nach Angaben des Anbieters auf Servern der Hetzner Online GmbH in Deutschland und Finnland gespeichert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO: das berechtigte Interesse an einer datensparsamen Reichweitenmessung und an der Verbesserung dieses Informationsangebots.</p>\n    <p>Weitere Informationen: <a href="https://www.goatcounter.com/help/privacy" rel="noopener">Datenschutzhinweise von GoatCounter</a>.</p>\n  </div>\n\n'''
          if 'Reichweitenmessung mit GoatCounter' not in text:
              text = text.replace(marker, section + marker, 1)
          de.write_text(text, encoding='utf-8')

          en = Path('datenschutz_en.html')
          text = en.read_text(encoding='utf-8')
          text = text.replace('Information pursuant to Art. 13 GDPR · As of July 2026', 'Information pursuant to Art. 13 GDPR · As of September 2026')
          text = text.replace(
              'This website is a static information resource. There are no user accounts, no comment function, no forms and no newsletter sign-up. No cookies are set and no analytics or tracking services are used. No user profiles are created.',
              'This website is a static information resource. There are no user accounts, no comment function, no forms and no newsletter sign-up. No cookies are set. GoatCounter is used for privacy-friendly audience measurement; no user profiles are created.'
          )
          marker = '''  <div class="block">\n    <h2>Hosting and server log files</h2>'''
          section = '''  <div class="block">\n    <h2>Audience measurement with GoatCounter</h2>\n    <p>GoatCounter, a privacy-friendly web analytics service operated by Martin Tournoij in Ireland, is used for statistical evaluation of site usage. The counting script is loaded from <code>gc.zgo.at</code>.</p>\n    <p>According to the provider, GoatCounter does not set cookies and does not store IP addresses, full User-Agent strings or persistent tracking IDs. To recognise repeat visits, the IP address and User-Agent are processed temporarily in memory (for up to eight hours) but are not stored in the database. Aggregated statistics are stored, in particular on pages viewed, referrers, browsers and operating systems, language, screen width and approximate location.</p>\n    <p>According to the provider, data for the hosted GoatCounter service are stored on servers of Hetzner Online GmbH in Germany and Finland. The legal basis is Art. 6 (1) (f) GDPR: the legitimate interest in privacy-friendly audience measurement and in improving this information resource.</p>\n    <p>Further information: <a href="https://www.goatcounter.com/help/privacy" rel="noopener">GoatCounter privacy information</a>.</p>\n  </div>\n\n'''
          if 'Audience measurement with GoatCounter' not in text:
              text = text.replace(marker, section + marker, 1)
          en.write_text(text, encoding='utf-8')

          print(f'Updated {len(changed)} HTML files plus privacy policy text.')
          PY
      - name: Commit changes and remove installer
        shell: bash
        run: |
          rm -f .github/workflows/install-goatcounter.yml
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Add privacy-friendly GoatCounter visitor statistics"
          git push origin main
